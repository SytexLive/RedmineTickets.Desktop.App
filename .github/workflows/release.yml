name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine release base
        id: base
        shell: bash
        run: |
          latest_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -n "$latest_tag" ]; then
            echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
            echo "range=${latest_tag}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release version
        id: version
        shell: bash
        run: |
          git log --format='%B%x1e' "${{ steps.base.outputs.range }}" > commit-messages.txt
          node scripts/release-version.mjs "${{ steps.base.outputs.version }}" < commit-messages.txt >> "$GITHUB_OUTPUT"

      - name: Sync version files
        if: steps.version.outputs.changed == 'true'
        run: npm run version:sync -- "${{ steps.version.outputs.version }}"

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Commit version files
        if: steps.version.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): v${{ steps.version.outputs.version }}"
          file_pattern: "package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json"
          tagging_message: "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
